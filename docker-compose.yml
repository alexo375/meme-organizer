services:
  postgres:
    image: postgres:16-alpine
    container_name: meme_organizer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow_db
    ports:
      - "5432:5432"
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: meme_organizer_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://mlflow:mlflow_password@postgres:5432/mlflow_db
    volumes:
      - mlflow_artifacts_data:/mlartifacts
    entrypoint: >
      bash -c "pip install psycopg2-binary && mlflow server --backend-store-uri postgresql+psycopg2://mlflow:mlflow_password@postgres:5432/mlflow_db --default-artifact-root mlflow-artifacts:/ --artifacts-destination /mlartifacts --serve-artifacts --host 0.0.0.0 --port 5000"

volumes:
  mlflow_postgres_data:
  mlflow_artifacts_data:
